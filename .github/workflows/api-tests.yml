name: API Automation Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: Typecheck and stable API suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Validate booking credentials
        env:
          RESTFUL_BOOKER_USERNAME: ${{ secrets.RESTFUL_BOOKER_USERNAME }}
          RESTFUL_BOOKER_PASSWORD: ${{ secrets.RESTFUL_BOOKER_PASSWORD }}
        run: |
          if [ -z "$RESTFUL_BOOKER_USERNAME" ] || [ -z "$RESTFUL_BOOKER_PASSWORD" ]; then
            echo "Missing RESTFUL_BOOKER_USERNAME or RESTFUL_BOOKER_PASSWORD GitHub secrets" >&2
            exit 1
          fi
      - name: Junior API tests
        run: npm run test:junior
        env:
          RESTFUL_BOOKER_USERNAME: ${{ secrets.RESTFUL_BOOKER_USERNAME }}
          RESTFUL_BOOKER_PASSWORD: ${{ secrets.RESTFUL_BOOKER_PASSWORD }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
